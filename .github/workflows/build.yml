name: Manual iPhone Build

on:
  push:
  workflow_dispatch:

jobs:
  build_native:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate Native iOS Code
        run: npx expo prebuild --platform ios --clean

      - name: Force Fix Node Path
        run: |
          NODE_PATH=$(command -v node)
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          sudo ln -s $NODE_PATH /usr/local/bin/node || true

      - name: Build for Real Device (iPhone)
        run: |
          set -e
          # The workspace/scheme name is generated from the app name in app.json,
          # so we detect it instead of hardcoding it.
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace: $WORKSPACE (scheme: $SCHEME)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA for Sideloading
        run: |
          set -e
          APP=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -n 1)
          NAME=$(basename "$APP" .app)
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr "$NAME.ipa" Payload
          echo "Created $NAME.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: "*.ipa"
